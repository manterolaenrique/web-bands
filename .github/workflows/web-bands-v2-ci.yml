name: Web Bands V2 CI

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'supabase/**'
      - 'docs/**'
      - '.github/workflows/web-bands-v2-ci.yml'
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'apps/web/**'
      - 'supabase/**'
      - 'docs/**'
      - '.github/workflows/web-bands-v2-ci.yml'

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SITE_URL: ${{ secrets.WEB_BANDS_V2_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.WEB_BANDS_V2_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WEB_BANDS_V2_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.WEB_BANDS_V2_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.WEB_BANDS_V2_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.WEB_BANDS_V2_SANITY_API_VERSION }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.WEB_BANDS_V2_SANITY_API_WRITE_TOKEN }}
      SUPABASE_SECRET_KEY: ${{ secrets.WEB_BANDS_V2_SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.WEB_BANDS_V2_RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.WEB_BANDS_V2_EMAIL_FROM }}
      E2E_REQUIRE_AUTH: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Strict end-to-end tests
        run: npm run test:e2e:strict
