<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Web Bands offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #050505;
        color: #f3f3f3;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(183, 109, 255, 0.18), transparent 30%),
          radial-gradient(circle at bottom, rgba(0, 203, 230, 0.16), transparent 28%),
          #050505;
      }

      main {
        width: min(100%, 28rem);
        padding: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(15, 15, 18, 0.92);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.78);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexion</h1>
      <p>La app pudo abrirse, pero hace falta internet para sincronizar bandas, permisos y cambios.</p>
    </main>
  </body>
</html>
