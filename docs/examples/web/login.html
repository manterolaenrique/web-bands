<script>
        // Magnetic Button Effect
        const btn = document.querySelector('#submit-btn');
        btn.addEventListener('mousemove', (e) => {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const deltaX = (x - centerX) / 8;
            const deltaY = (y - centerY) / 4;
            
            btn.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        });

        btn.addEventListener('mouseleave', () => {
            btn.style.transform = 'translate(0, 0)';
        });

        // Background Interaction
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            // Subtle shift of background based on mouse
            document.body.style.backgroundPosition = `${x * 10}% ${y * 10}%`;
        });

        // Standard Button interactions
        const allButtons = document.querySelectorAll('button:not(#submit-btn)');
        allButtons.forEach(button => {
            button.addEventListener('mousedown', function() {
                this.classList.add('scale-95');
            });
            button.addEventListener('mouseup', function() {
                this.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', function() {
                this.classList.remove('scale-95');
            });
        });
    </script>
