</div>
</div>

<!-- Atmosphere/Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.glass-panel');
            
            // Subtle tilt effect on touch/mouse
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            // Focus interactions
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    card.classList.add('neon-glow-secondary');
                });
                input.addEventListener('blur', () => {
                    card.classList.remove('neon-glow-secondary');
                });
            });

            // Show/Hide password toggle
            const passToggle = document.querySelector('button[type="button"]');
            const passInput = document.querySelector('#password');
            passToggle.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                passToggle.children[0].textContent = isPass ? 'visibility_off' : 'visibility';
            });
        });
    </script>
