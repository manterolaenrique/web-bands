<!-- Scripts -->
<script>
        function toggleBottomSheet() {
            const sheet = document.getElementById('bottomSheet');
            const backdrop = document.getElementById('backdrop');
            
            if (sheet.classList.contains('translate-y-full')) {
                // Open
                sheet.classList.remove('translate-y-full');
                sheet.classList.add('translate-y-0');
                backdrop.classList.remove('opacity-0', 'pointer-events-none');
                backdrop.classList.add('opacity-100', 'pointer-events-auto');
            } else {
                // Close
                sheet.classList.remove('translate-y-0');
                sheet.classList.add('translate-y-full');
                backdrop.classList.remove('opacity-100', 'pointer-events-auto');
                backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Interaction for the demo button to show the menu
        // Actually the prompt asked for "two states", usually implied as switchable or both visible. 
        // I've implemented the empty state as the base and the bottom sheet as an interactive overlay.
    </script>
